name: Windows diagnostic checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/DiagnosticChecks -c Release
      - run: dotnet publish src/TacomaDiag -c Release -r win-x64 --self-contained true -o publish/windows
      - uses: actions/upload-artifact@v4
        with:
          name: OBD2MasterCustom-Windows-x64
          path: publish/windows/
